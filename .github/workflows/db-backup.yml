# Nightly Supabase backup for the free plan (which has no downloadable
# backups or point-in-time recovery). Keeps 7 days of encrypted dumps as
# workflow artifacts and doubles as a daily "activity" ping so the free
# project is never paused for inactivity.
#
# Setup (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL     Supabase → Connect → "Session pooler" URI
#                       (the direct db.<ref>.supabase.co host is IPv6-only;
#                       GitHub runners need the IPv4 pooler)
#   BACKUP_PASSPHRASE   long random string; store it somewhere safe too,
#                       it is the only way to open the backups
#
# Restore: download the artifact, then
#   gpg -d finkoin-data.dump.gpg > finkoin-data.dump
#   pg_restore --no-owner --dbname "$TARGET_DB_URL" finkoin-data.dump

name: Database backup

on:
  schedule:
    - cron: "30 20 * * *" # 02:00 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::warning::SUPABASE_DB_URL / BACKUP_PASSPHRASE not set; skipping backup."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dump schema and data
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p out
          # Match the server's major version (Postgres 17).
          docker run --rm -e DB_URL="$SUPABASE_DB_URL" -v "$PWD/out:/out" postgres:17 \
            sh -c '
              set -e
              pg_dump "$DB_URL" --schema-only --no-owner --no-privileges \
                --schema=public > /out/finkoin-schema.sql
              pg_dump "$DB_URL" --format=custom --no-owner --no-privileges \
                --schema=public --schema=auth > /out/finkoin-data.dump
            '
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 -o out/finkoin-data.dump.gpg out/finkoin-data.dump
          rm out/finkoin-data.dump
          ls -lh out

      - name: Upload encrypted data dump
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: finkoin-data-${{ github.run_id }}
          path: out/finkoin-data.dump.gpg
          retention-days: 7

      - name: Upload schema snapshot
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: finkoin-schema-${{ github.run_id }}
          path: out/finkoin-schema.sql
          retention-days: 30
