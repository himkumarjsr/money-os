# .github/workflows/pr-checks.yml
# Runs on every Pull Request
# Shows green/red check on GitHub

name: PR Checks

on:
  pull_request:
    branches: [main, production]

jobs:
  quality-check:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Get the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci
        # npm ci is faster than npm install
        # uses exact versions from package-lock.json

      # Step 4: TypeScript check
      # Catches type errors before they reach production
      - name: TypeScript check
        run: npx tsc --noEmit
        # noEmit = just check, don't build

      # Step 5: Build test
      # If build fails PR cannot be merged
      - name: Build test
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: https://uat.finkoin.com

      # Step 6: Check for console.log
      # Prevent debug logs reaching production
      - name: Check for console.log
        run: |
          if grep -r "console\.log" \
            --include="*.ts" \
            --include="*.tsx" \
            --exclude-dir=node_modules \
            --exclude-dir=.next \
            .; then
            echo "WARNING: console.log found"
            echo "Remove before production"
            # Warning only, not failure
            # Change exit 1 to fail hard
          fi

      # Step 7: Check for hardcoded secrets
      - name: Check for secrets
        run: |
          if grep -r "sk-ant-\|re_\|rzp_live" \
            --include="*.ts" \
            --include="*.tsx" \
            --exclude-dir=node_modules \
            .; then
            echo "ERROR: Hardcoded secret found!"
            exit 1
          fi